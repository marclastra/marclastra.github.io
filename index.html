<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MARCLASTRA — Portfolio</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: #111;
            color: white;
            padding: 22px 30px;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-button {
            background: #333;
            color: white;

            padding: 11px 16px;
            border-radius: 8px;

            font-size: 14px;
        }

        .header-button:hover {
            background: #444;
        }

        .admin-button {
            background: white;
            color: #111;
        }

        .admin-button:hover {
            background: #ddd;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            max-width: 1200px;
            margin: auto;

            padding: 80px 30px 60px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 82px);
            letter-spacing: -3px;
            margin-bottom: 15px;
        }

        .hero p {
            max-width: 650px;

            color: #777;
            font-size: 18px;
            line-height: 1.6;
        }


        /* =========================
           PORTFOLIO
        ========================= */

        .portfolio-container {
            max-width: 1200px;
            margin: auto;

            padding: 0 30px 80px;
        }

        .portfolio-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            margin-bottom: 30px;

            gap: 20px;
        }

        .portfolio-header h2 {
            font-size: 30px;
        }

        .portfolio-header p {
            color: #777;
            margin-top: 6px;
        }


        .new-button {
            background: #111;
            color: white;

            padding: 13px 18px;
            border-radius: 8px;

            white-space: nowrap;
        }

        .new-button:hover {
            background: #333;
        }


        /* =========================
           POSTS
        ========================= */

        #portfolio-list {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 30px;
        }


        .post {
            background: white;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }


        .post-image {
            width: 100%;
            height: 300px;

            object-fit: cover;

            display: block;
        }


        .post-content {
            padding: 25px;
        }


        .post-date {
            color: #999;

            font-size: 12px;

            margin-bottom: 10px;
        }


        .post-title {
            font-size: 24px;

            margin-bottom: 12px;
        }


        .post-text {
            color: #666;

            line-height: 1.6;

            white-space: pre-wrap;
        }


        .post-actions {
            display: flex;

            gap: 8px;

            margin-top: 20px;
        }


        .edit-button,
        .delete-button {
            padding: 9px 13px;

            border-radius: 7px;

            font-size: 13px;
        }


        .edit-button {
            background: #eee;
            color: #111;
        }


        .delete-button {
            background: #b3261e;
            color: white;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            background: white;

            padding: 50px;

            border-radius: 14px;

            text-align: center;

            color: #888;
        }


        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.55);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }


        .modal {
            width: 100%;
            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            background: white;

            border-radius: 16px;

            padding: 30px;
        }


        .modal h2 {
            margin-bottom: 25px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        input,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 14px;
        }


        textarea {
            min-height: 180px;

            resize: vertical;
        }


        .preview {
            width: 100%;

            max-height: 250px;

            object-fit: cover;

            border-radius: 8px;

            margin-top: 10px;

            display: none;
        }


        .modal-buttons {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 25px;
        }


        .cancel-button {
            background: #eee;

            color: #111;

            padding: 12px 17px;

            border-radius: 8px;
        }


        .save-button {
            background: #111;

            color: white;

            padding: 12px 17px;

            border-radius: 8px;
        }


        .error {
            color: #b3261e;

            font-size: 14px;

            margin-top: 12px;
        }


        /* =========================
           LOGIN
        ========================= */

        .login-info {
            background: #f5f5f5;

            border-radius: 8px;

            padding: 12px;

            font-size: 13px;

            color: #666;

            margin-bottom: 20px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid #ddd;

            padding: 30px;

            text-align: center;

            color: #888;

            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 18px;
            }

            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .header-button {
                flex: 1;
            }

            .hero {
                padding:
                    55px 20px
                    45px;
            }

            .portfolio-container {
                padding:
                    0 20px
                    60px;
            }

            .portfolio-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .new-button {
                width: 100%;
            }

            #portfolio-list {
                grid-template-columns: 1fr;
            }

            .post-image {
                height: 250px;
            }

            .modal {
                padding: 22px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-inner">

        <div class="logo">
            MARCLASTRA
        </div>


        <div class="header-actions">

            <button
                class="header-button"
                id="private-button"
            >
                🔒 Área privada
            </button>


            <button
                class="header-button admin-button"
                id="login-button"
                style="display:none;"
            >
                ✚ Nueva publicación
            </button>

        </div>

    </div>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        Portfolio
    </h1>

    <p>
        Una selección de trabajos, proyectos y
        experiencias de Marc Lastra.
    </p>

</section>


<!-- =========================
     PORTFOLIO
========================= -->

<main class="portfolio-container">

    <div class="portfolio-header">

        <div>

            <h2>
                Trabajos
            </h2>

            <p>
                Proyectos y experiencias.
            </p>

        </div>


        <button
            class="new-button"
            id="new-post-button"
            style="display:none;"
        >
            + Nueva publicación
        </button>

    </div>


    <div id="portfolio-list">

        <div class="empty">
            Cargando portfolio...
        </div>

    </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    © MARCLASTRA

</footer>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal-overlay"
    id="post-modal"
>

    <div class="modal">

        <h2 id="modal-title">
            Nueva publicación
        </h2>


        <div class="login-info">

            Esta publicación será visible
            públicamente en tu portfolio.

        </div>


        <div class="form-group">

            <label>
                Título
            </label>

            <input
                type="text"
                id="post-title"
                placeholder="Título del proyecto"
            >

        </div>


        <div class="form-group">

            <label>
                Fecha
            </label>

            <input
                type="date"
                id="post-date"
            >

        </div>


        <div class="form-group">

            <label>
                Texto
            </label>

            <textarea
                id="post-text"
                placeholder="Escribe aquí la descripción del proyecto..."
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                Imagen
            </label>

            <input
                type="file"
                id="post-image"
                accept="image/*"
            >


            <img
                id="image-preview"
                class="preview"
            >

        </div>


        <div
            id="modal-error"
            class="error"
        ></div>


        <div class="modal-buttons">

            <button
                class="cancel-button"
                id="cancel-button"
            >
                Cancelar
            </button>


            <button
                class="save-button"
                id="save-button"
            >
                Publicar
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://xcyqbqegaklxpcbxwjia.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_S5AlKHY4yzGiPm5M5NgeSA_JYzPyrER";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTOS
===================================================== */

const portfolioList =
    document.getElementById(
        "portfolio-list"
    );


const newPostButton =
    document.getElementById(
        "new-post-button"
    );


const postModal =
    document.getElementById(
        "post-modal"
    );


const modalTitle =
    document.getElementById(
        "modal-title"
    );


const postTitle =
    document.getElementById(
        "post-title"
    );


const postDate =
    document.getElementById(
        "post-date"
    );


const postText =
    document.getElementById(
        "post-text"
    );


const postImage =
    document.getElementById(
        "post-image"
    );


const imagePreview =
    document.getElementById(
        "image-preview"
    );


const modalError =
    document.getElementById(
        "modal-error"
    );


const saveButton =
    document.getElementById(
        "save-button"
    );


let currentUser =
    null;


let editingPost =
    null;


/* =====================================================
   SESIÓN
===================================================== */

async function checkSession() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getSession();


    currentUser =
        data.session
            ? data.session.user
            : null;


    updateAdminInterface();

}


function updateAdminInterface() {

    if (currentUser) {

        newPostButton.style.display =
            "block";

    }

    else {

        newPostButton.style.display =
            "none";

    }

}


/* =====================================================
   CARGAR PORTFOLIO
===================================================== */

async function loadPortfolio() {

    portfolioList.innerHTML =
        `
        <div class="empty">
            Cargando portfolio...
        </div>
        `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("portfolio")
            .select("*")
            .eq(
                "publicado",
                true
            )
            .order(
                "fecha",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Error cargando portfolio:",
            error
        );


        portfolioList.innerHTML =
            `
            <div class="empty">
                No se ha podido cargar el portfolio.
            </div>
            `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        portfolioList.innerHTML =
            `
            <div class="empty">
                Todavía no hay publicaciones.
            </div>
            `;

        return;

    }


    portfolioList.innerHTML =
        "";


    data.forEach(
        function(post) {

            const article =
                document.createElement(
                    "article"
                );


            article.className =
                "post";


            let imageHTML =
                "";


            if (post.imagen) {

                imageHTML =
                    `
                    <img
                        class="post-image"
                        src="${escapeHtml(
                            post.imagen
                        )}"
                        alt="${escapeHtml(
                            post.titulo
                        )}"
                    >
                    `;

            }


            const date =
                post.fecha
                    ? new Date(
                        post.fecha +
                        "T00:00:00"
                    ).toLocaleDateString(
                        "es-ES",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    )
                    : "";


            let actionsHTML =
                "";


            if (
                currentUser &&
                post.user_id ===
                    currentUser.id
            ) {

                actionsHTML =
                    `
                    <div class="post-actions">

                        <button
                            class="edit-button"
                            data-id="${post.id}"
                        >
                            ✏️ Editar
                        </button>

                        <button
                            class="delete-button"
                            data-id="${post.id}"
                        >
                            🗑️ Eliminar
                        </button>

                    </div>
                    `;

            }


            article.innerHTML =
                `

                ${imageHTML}

                <div class="post-content">

                    <div class="post-date">
                        ${escapeHtml(date)}
                    </div>

                    <h3 class="post-title">
                        ${escapeHtml(
                            post.titulo
                        )}
                    </h3>

                    <div class="post-text">
                        ${escapeHtml(
                            post.texto || ""
                        )}
                    </div>

                    ${actionsHTML}

                </div>

                `;


            const editButton =
                article.querySelector(
                    ".edit-button"
                );


            if (editButton) {

                editButton.addEventListener(
                    "click",
                    function() {

                        openEditModal(
                            post
                        );

                    }
                );

            }


            const deleteButton =
                article.querySelector(
                    ".delete-button"
                );


            if (deleteButton) {

                deleteButton.addEventListener(
                    "click",
                    function() {

                        deletePost(
                            post
                        );

                    }
                );

            }


            portfolioList.appendChild(
                article
            );

        }
    );

}


/* =====================================================
   NUEVA PUBLICACIÓN
===================================================== */

newPostButton.addEventListener(
    "click",
    function() {

        openNewModal();

    }
);


function openNewModal() {

    editingPost =
        null;


    modalTitle.textContent =
        "Nueva publicación";


    saveButton.textContent =
        "Publicar";


    postTitle.value =
        "";


    postDate.value =
        new Date()
            .toISOString()
            .split("T")[0];


    postText.value =
        "";


    postImage.value =
        "";


    imagePreview.src =
        "";


    imagePreview.style.display =
        "none";


    modalError.textContent =
        "";


    postModal.style.display =
        "flex";

}


/* =====================================================
   EDITAR
===================================================== */

function openEditModal(post) {

    editingPost =
        post;


    modalTitle.textContent =
        "Editar publicación";


    saveButton.textContent =
        "Guardar cambios";


    postTitle.value =
        post.titulo || "";


    postDate.value =
        post.fecha || "";


    postText.value =
        post.texto || "";


    postImage.value =
        "";


    if (post.imagen) {

        imagePreview.src =
            post.imagen;

        imagePreview.style.display =
            "block";

    }

    else {

        imagePreview.style.display =
            "none";

    }


    modalError.textContent =
        "";


    postModal.style.display =
        "flex";

}


/* =====================================================
   CERRAR MODAL
===================================================== */

document
    .getElementById(
        "cancel-button"
    )
    .addEventListener(
        "click",
        closeModal
    );


postModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            postModal
        ) {

            closeModal();

        }

    }
);


function closeModal() {

    postModal.style.display =
        "none";

    editingPost =
        null;

}


/* =====================================================
   PREVISUALIZACIÓN
===================================================== */

postImage.addEventListener(
    "change",
    function() {

        const file =
            postImage.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                imagePreview.src =
                    event.target.result;

                imagePreview.style.display =
                    "block";

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =====================================================
   GUARDAR PUBLICACIÓN
===================================================== */

saveButton.addEventListener(
    "click",
    async function() {

        modalError.textContent =
            "";


        if (!currentUser) {

            modalError.textContent =
                "Necesitas iniciar sesión.";

            return;

        }


        const titulo =
            postTitle.value.trim();


        const texto =
            postText.value.trim();


        const fecha =
            postDate.value;


        if (!titulo) {

            modalError.textContent =
                "Escribe un título.";

            return;

        }


        if (!texto) {

            modalError.textContent =
                "Escribe el texto.";

            return;

        }


        if (!fecha) {

            modalError.textContent =
                "Selecciona una fecha.";

            return;

        }


        saveButton.disabled =
            true;


        saveButton.textContent =
            "Guardando...";


        try {

            let imageUrl =
                editingPost
                    ? editingPost.imagen
                    : null;


            /* =========================
               SUBIR IMAGEN
            ========================= */

            const file =
                postImage.files[0];


            if (file) {

                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const fileName =
                    currentUser.id +
                    "/" +
                    Date.now() +
                    "." +
                    extension;


                const {
                    error:
                        uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("portfolio")
                        .upload(
                            fileName,
                            file,
                            {
                                upsert: false
                            }
                        );


                if (uploadError) {

                    throw uploadError;

                }


                const {
                    data:
                        publicData
                } =
                    supabaseClient
                        .storage
                        .from("portfolio")
                        .getPublicUrl(
                            fileName
                        );


                imageUrl =
                    publicData.publicUrl;

            }


            /* =========================
               DATOS
            ========================= */

            const portfolioData = {

                user_id:
                    currentUser.id,

                titulo:
                    titulo,

                fecha:
                    fecha,

                texto:
                    texto,

                imagen:
                    imageUrl,

                publicado:
                    true,

                updated_at:
                    new Date().toISOString()

            };


            let result;


            /* =========================
               EDITAR
            ========================= */

            if (editingPost) {

                result =
                    await supabaseClient
                        .from("portfolio")
                        .update(
                            portfolioData
                        )
                        .eq(
                            "id",
                            editingPost.id
                        )
                        .eq(
                            "user_id",
                            currentUser.id
                        );

            }


            /* =========================
               CREAR
            ========================= */

            else {

                result =
                    await supabaseClient
                        .from("portfolio")
                        .insert({

                            ...portfolioData,

                            created_at:
                                new Date()
                                    .toISOString()

                        });

            }


            if (result.error) {

                throw result.error;

            }


            closeModal();


            await loadPortfolio();

        }

        catch (error) {

            console.error(
                "Error guardando publicación:",
                error
            );


            modalError.textContent =
                "No se ha podido guardar la publicación. Revisa las políticas de Supabase.";

        }


        finally {

            saveButton.disabled =
                false;


            saveButton.textContent =
                editingPost
                    ? "Guardar cambios"
                    : "Publicar";

        }

    }
);


/* =====================================================
   ELIMINAR PUBLICACIÓN
===================================================== */

async function deletePost(post) {

    if (!currentUser) {
        return;
    }


    const confirmed =
        confirm(
            "¿Seguro que quieres eliminar esta publicación?"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("portfolio")
            .delete()
            .eq(
                "id",
                post.id
            )
            .eq(
                "user_id",
                currentUser.id
            );


    if (error) {

        console.error(
            error
        );


        alert(
            "No se ha podido eliminar la publicación."
        );

        return;

    }


    await loadPortfolio();

}


/* =====================================================
   ÁREA PRIVADA
===================================================== */

document
    .getElementById(
        "private-button"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "./privado.html";

        }
    );


/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}


/* =====================================================
   INICIO
===================================================== */

async function init() {

    await checkSession();

    await loadPortfolio();

}


init();


/* =====================================================
   CAMBIOS DE SESIÓN
===================================================== */

supabaseClient
    .auth
    .onAuthStateChange(
        function(
            event,
            session
        ) {

            currentUser =
                session
                    ? session.user
                    : null;


            updateAdminInterface();

            loadPortfolio();

        }
    );

</script>

</body>

</html>
