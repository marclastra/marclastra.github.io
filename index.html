<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MARCLASTRA — Portfolio</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 30px 20px;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .logo h1 {
            font-size: 26px;
            letter-spacing: 2px;
        }

        .logo p {
            color: #aaa;
            margin-top: 6px;
            font-size: 14px;
        }

        .private-button {
            display: inline-block;
            padding: 11px 16px;

            background: #333;
            color: white;

            border-radius: 8px;

            text-decoration: none;

            font-size: 14px;
        }

        .private-button:hover {
            background: #555;
        }

        main {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .intro {
            margin-bottom: 45px;
        }

        .intro h2 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .intro p {
            color: #777;
            font-size: 16px;
        }

        .portfolio-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 25px;
        }

        .portfolio-card {
            background: white;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.08);

            transition: 0.2s;
        }

        .portfolio-card:hover {
            transform: translateY(-4px);
        }

        .portfolio-image {
            width: 100%;
            height: 240px;

            object-fit: cover;

            display: block;

            background: #ddd;
        }

        .portfolio-content {
            padding: 24px;
        }

        .portfolio-date {
            color: #999;

            font-size: 12px;

            margin-bottom: 8px;
        }

        .portfolio-title {
            font-size: 22px;

            margin-bottom: 12px;
        }

        .portfolio-text {
            color: #666;

            line-height: 1.6;

            white-space: pre-wrap;
        }

        .empty {
            background: white;

            padding: 50px;

            border-radius: 14px;

            text-align: center;

            color: #888;
        }

        .loading {
            text-align: center;

            color: #888;

            padding: 50px;
        }

        footer {
            margin-top: 70px;

            padding: 30px 20px;

            text-align: center;

            color: #999;

            font-size: 13px;
        }

        @media (max-width: 600px) {

            .header-content {
                flex-direction: column;

                align-items: flex-start;
            }

            .intro h2 {
                font-size: 30px;
            }

            .portfolio-image {
                height: 210px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="logo">

            <h1>
                MARCLASTRA
            </h1>

            <p>
                Events · Production · Portfolio
            </p>

        </div>


        <!-- SOLO TÚ SABES QUE EXISTE ESTE ACCESO -->

        <a
            href="./private.html"
            class="private-button"
        >
            Acceso privado
        </a>

    </div>

</header>


<main>

    <section class="intro">

        <h2>
            Portfolio
        </h2>

        <p>
            Algunos de mis trabajos y proyectos.
        </p>

    </section>


    <section
        id="portfolio-grid"
        class="portfolio-grid"
    >

        <div class="loading">
            Cargando portfolio...
        </div>

    </section>

</main>


<footer>

    © MARCLASTRA

</footer>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://xcyqbqegaklxpcbxwjia.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_S5AlKHY4yzGiPm5M5NgeSA_JYzPyrER";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTOS
===================================================== */

const portfolioGrid =
    document.getElementById(
        "portfolio-grid"
    );


/* =====================================================
   CARGAR PORTFOLIO PÚBLICO
===================================================== */

async function loadPublicPortfolio() {

    portfolioGrid.innerHTML =
        `
        <div class="loading">
            Cargando portfolio...
        </div>
        `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("portfolio")
            .select(
                "id,titulo,fecha,texto,imagen"
            )
            .eq(
                "publicado",
                true
            )
            .order(
                "fecha",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Error cargando portfolio:",
            error
        );


        portfolioGrid.innerHTML =
            `
            <div class="empty">
                No se ha podido cargar el portfolio.
            </div>
            `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        portfolioGrid.innerHTML =
            `
            <div class="empty">
                Todavía no hay trabajos publicados.
            </div>
            `;

        return;

    }


    portfolioGrid.innerHTML =
        "";


    data.forEach(
        function(item) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "portfolio-card";


            /* -----------------------------------------
               IMAGEN
            ----------------------------------------- */

            if (item.imagen) {

                const image =
                    document.createElement(
                        "img"
                    );


                image.className =
                    "portfolio-image";


                image.alt =
                    item.titulo || "Portfolio";


                image.src =
                    getPortfolioImageUrl(
                        item.imagen
                    );


                card.appendChild(
                    image
                );

            }


            /* -----------------------------------------
               CONTENIDO
            ----------------------------------------- */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "portfolio-content";


            if (item.fecha) {

                const date =
                    document.createElement(
                        "div"
                    );


                date.className =
                    "portfolio-date";


                date.textContent =
                    formatDate(
                        item.fecha
                    );


                content.appendChild(
                    date
                );

            }


            const title =
                document.createElement(
                    "h3"
                );


            title.className =
                "portfolio-title";


            title.textContent =
                item.titulo || "";


            content.appendChild(
                title
            );


            if (item.texto) {

                const text =
                    document.createElement(
                        "p"
                    );


                text.className =
                    "portfolio-text";


                text.textContent =
                    item.texto;


                content.appendChild(
                    text
                );

            }


            card.appendChild(
                content
            );


            portfolioGrid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   URL IMAGEN
===================================================== */

function getPortfolioImageUrl(
    imagePath
) {

    /*
       Si ya tenemos una URL completa,
       la utilizamos directamente.
    */

    if (
        imagePath.startsWith(
            "http://"
        ) ||
        imagePath.startsWith(
            "https://"
        )
    ) {

        return imagePath;

    }


    /*
       Si guardamos una ruta dentro
       del bucket portfolio.
    */

    const {
        data
    } =
        supabaseClient
            .storage
            .from("portfolio")
            .getPublicUrl(
                imagePath
            );


    return data.publicUrl;

}


/* =====================================================
   FECHA
===================================================== */

function formatDate(
    dateString
) {

    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return dateString;

    }


    return date.toLocaleDateString(
        "es-ES",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   INICIAR
===================================================== */

loadPublicPortfolio();

</script>


</body>

</html>
